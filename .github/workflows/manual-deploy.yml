name: Manual Production Deployment

# Only runs when manually commanded from GitHub Actions UI or GitHub CLI
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select which component to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - frontend
          - node-backend
          - fastapi-ai-service
      reason:
        description: "Reason / Note for deployment"
        required: false
        default: "Manual deployment trigger"

jobs:
  # ==========================================================
  # 1. Deploy Frontend to Vercel (hackfest-fe)
  # ==========================================================
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    if: inputs.target == 'all' || inputs.target == 'frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hackfest-fe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ==========================================================
  # 2. Deploy Node.js Backend to Render
  # ==========================================================
  deploy-node-backend:
    name: Deploy Node Backend (Render)
    if: inputs.target == 'all' || inputs.target == 'node-backend'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (Node Backend)
        run: |
          if [ -z "${{ secrets.RENDER_NODE_DEPLOY_HOOK }}" ]; then
            echo "::error::Secret RENDER_NODE_DEPLOY_HOOK is missing in repository settings!"
            exit 1
          fi
          echo "Triggering deployment for Node backend on Render..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_NODE_DEPLOY_HOOK }}")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully triggered Render deployment for Node backend!"
            echo "$BODY"
          else
            echo "::error::Render deployment hook failed with status $HTTP_STATUS: $BODY"
            exit 1
          fi

  # ==========================================================
  # 3. Deploy FastAPI AI Service to Render
  # ==========================================================
  deploy-ai-service:
    name: Deploy FastAPI AI Service (Render)
    if: inputs.target == 'all' || inputs.target == 'fastapi-ai-service'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (FastAPI AI Service)
        run: |
          if [ -z "${{ secrets.RENDER_AI_SERVICE_DEPLOY_HOOK }}" ]; then
            echo "::error::Secret RENDER_AI_SERVICE_DEPLOY_HOOK is missing in repository settings!"
            exit 1
          fi
          echo "Triggering deployment for FastAPI AI Service on Render..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_AI_SERVICE_DEPLOY_HOOK }}")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully triggered Render deployment for FastAPI AI Service!"
            echo "$BODY"
          else
            echo "::error::Render deployment hook failed with status $HTTP_STATUS: $BODY"
            exit 1
          fi

